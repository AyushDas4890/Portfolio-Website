<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>C4Future scene</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #ebeee7;
    --ink: #2b3a30;
    --ink-soft: #3d4a41;
    --muted: #6b746c;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .footer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); isolation: isolate; }
  .footer__video {
    order: 2; flex: 1 1 0; min-height: 0; display: block; width: 100%; height: auto;
    margin-top: -120px; object-fit: cover; object-position: 50% 35%;
    mix-blend-mode: multiply; position: relative; z-index: 0;
  }
  .footer__content { order: 1; flex: none; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 44px 16px 0; }
  .footer__mark { width: 62px; height: auto; color: var(--ink); display: block; }
  .footer__brand { margin: 12px 0 0; font-family: var(--serif); font-weight: 600; font-variation-settings: "opsz" 72; font-size: 58px; line-height: 1; letter-spacing: -0.015em; color: var(--ink); }
  .footer__tagline { margin: 18px 0 0; font-size: 17px; line-height: 1.5; color: var(--ink-soft); }
  .footer__nav { margin-top: 40px; }
  .footer__nav ul { list-style: none; display: flex; justify-content: center; align-items: center; }
  .footer__nav li { display: flex; align-items: center; font-size: 17px; }
  .footer__nav li + li::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); margin: 0 24px; }
  .footer__copy { margin: 28px 0 0; font-size: 13px; color: var(--muted); letter-spacing: .01em; }
</style>
</head>
<body>
<footer class="footer">
  <img class="footer__video" id="frame" src="/scripts/.raw/horses/f0001.jpg" alt="" />
  <div class="footer__content">
    <svg class="footer__mark" viewBox="0 0 64 64" role="img" aria-label="C4Future compass">
      <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2.2" />
      <circle cx="32" cy="32" r="25.5" fill="none" stroke="currentColor" stroke-width=".8" opacity=".5" />
      <g fill="currentColor" opacity=".85">
        <path d="M32 32 L46 18 L35.2 34.4 Z" />
        <path d="M32 32 L46 46 L29.6 35.2 Z" />
        <path d="M32 32 L18 46 L28.8 29.6 Z" />
        <path d="M32 32 L18 18 L34.4 28.8 Z" />
      </g>
      <g stroke="currentColor" stroke-width="1" stroke-linejoin="round">
        <path d="M32 8 L35.5 28.5 L32 32 Z" fill="currentColor" />
        <path d="M32 8 L28.5 28.5 L32 32 Z" fill="none" />
        <path d="M56 32 L35.5 35.5 L32 32 Z" fill="currentColor" />
        <path d="M56 32 L35.5 28.5 L32 32 Z" fill="none" />
        <path d="M32 56 L28.5 35.5 L32 32 Z" fill="currentColor" />
        <path d="M32 56 L35.5 35.5 L32 32 Z" fill="none" />
        <path d="M8 32 L28.5 28.5 L32 32 Z" fill="currentColor" />
        <path d="M8 32 L28.5 35.5 L32 32 Z" fill="none" />
      </g>
      <circle cx="32" cy="32" r="1.8" fill="#ebeee7" stroke="currentColor" stroke-width="1" />
    </svg>
    <p class="footer__brand">c4future</p>
    <p class="footer__tagline">Estimate, explain and compare a product's lifecycle emissions before you make it.</p>
    <nav class="footer__nav"><ul>
      <li>Calculate</li><li>Results</li><li>Compare</li><li>Decompose</li><li>Insights</li><li>Advisor</li>
    </ul></nav>
    <p class="footer__copy">XGBoost regressor · Conformal 90% intervals · TreeSHAP attributions · under 100 ms</p>
  </div>
</footer>
<script>
const img = document.getElementById('frame')
window.sceneReady = () => document.fonts.ready.then(() => true)
window.renderFrame = async (n) => {
  img.src = `/scripts/.raw/horses/f${String(n).padStart(4, '0')}.jpg`
  try { await img.decode() } catch {}
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
}
</script>
</body>
</html>
